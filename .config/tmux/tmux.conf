# Ref from http://mutelight.org/practical-tmux

# Set colors
set -g default-terminal "xterm-256color"
set -g base-index 1
## NOTE: new setting
setw -g pane-base-index 1


## NOTE: new setting
set -g status-keys vi
set -g mode-keys   vi


# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix

set  -g mouse on
set  -g focus-events on
set  -s escape-time       50
## NOTE: 3 new settings
set  -g history-limit     5000
setw -g aggressive-resize off
setw -g clock-mode-style  12


set -g prefix2 C-t
bind-key C-t send-prefix -2

setw -g xterm-keys on

# Remap window navigation to vim
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

# Switch panes, Fast window navigation
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R
bind -n C-M-n next-window
bind -n C-M-p previous-window

# Reload source
bind r source-file ~/.config/tmux/tmux.conf

## NOTE: 2 new settings
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

## NOTE: new setting
bind m command-prompt -p "join pane to window:" "join-pane -t ':%%'"
bind M set -g mouse \; display "Mouse #{?mouse,ON,OFF}!"

## Set status bar
# set -g status-utf8 on
set -g status-bg colour237
set -g status-fg colour103

## NOTE: new setting
set -g status on
set -g status-interval 5
set -g status-justify left
# set -g status-left-length 90
# set -g status-right-length 60

## WARN: delete 2 settings?
set -g status-left "#[fg=colour3][#S] #[fg=blue]#{pane_tty} #{?pane_in_mode,#[fg=white#,dim],#[fg=colour80#,dim]}#D #[fg=white,bold]| "
set -g status-right '#[fg=colour249]#{user}@#H #[fg=blue]%R '

setw -g pane-border-status top
setw -g pane-border-format '#{pane_index} #{pane_current_command} #{b:pane_current_path}'

set -g set-titles on
set -g set-titles-string '#(whoami)@#h :: [#S]'

setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}:#{b:pane_current_path}'

## WARN: delete 2 settings?
setw -g window-status-format '#[fg=colour250,dim]#{window_index}:#{window_name}'
setw -g window-status-current-format '#[fg=colour11,bold]#{window_index}:#{window_name}'


set -g update-environment "SSH_AUTH_SOCK"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g allow-passthrough on

# bind-key / split-window -v -l 15

