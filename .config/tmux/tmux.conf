# Portable tmux configuration synced from expnix.
# Plugin loading, Home Manager generation and Nix store paths are intentionally omitted.

set -g default-terminal "xterm-256color"
set -g base-index 1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys vi

# Prefix: Ctrl-a; Ctrl-t is available as a secondary prefix.
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" C-a send-prefix
set -g prefix2 C-t
bind-key C-t send-prefix -2

set -g mouse on
set -g focus-events on
setw -g aggressive-resize off
setw -g clock-mode-style 12
set -s escape-time 50
set -g history-limit 10000

setw -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-clipboard external

# Native vi copy-mode bindings; clipboard transport is handled by the terminal (OSC 52).
bind-key -T copy-mode-vi q send-keys -X cancel
bind-key -T copy-mode-vi C-c send-keys -X cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Pane and window navigation.
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n C-M-n next-window
bind -n C-M-p previous-window

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5
bind -n M-N swap-window -t +1 \; select-window -t +1
bind -n M-P swap-window -t -1 \; select-window -t -1

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Floating pane requires tmux 3.7+; prefix F keeps the original find-window workflow.
bind f new-pane -c "#{pane_current_path}"
bind F command-prompt { find-window -Z "%%" }

bind m command-prompt -p "join pane to window:" "join-pane -t ':%%'"
bind M set -g mouse \; display "Mouse #{?mouse,ON,OFF}!"

# Native status line: no theme or polling plugin dependency.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 120
set -g status-bg colour237
set -g status-fg colour103
set -g status-left '#[fg=colour11,bold] #S '
set -g status-right '#[fg=colour249]#{user}@#H #[fg=colour103]%H:%M '

setw -g window-status-format '#[fg=colour250,dim]#{window_index}:#{window_name}'
setw -g window-status-current-format '#[fg=colour11,bold]#{window_index}:#{window_name}'

setw -g pane-border-status top
setw -g pane-border-format '#{pane_index} #{pane_current_command} #{b:pane_current_path}'

set -g set-titles on
set -g set-titles-string '#{user}@#h :: [#S]'

setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}:#{b:pane_current_path}'

set -g update-environment "SSH_AUTH_SOCK"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g allow-passthrough on
