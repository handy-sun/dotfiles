[mgr]
ratio = [1, 4, 5]
show_hidden = true
scrolloff = 6

[preview]
wrap = "yes"
tab_size = 4

[opener]
play = [
    { run = "mpv %s", orphan = true } ,
]
edit = [
    { run = '$EDITOR %s1', block = true, for = "unix" },
    { run = "%EDITOR% %*",  block = true, for = "windows" },
]
open = [
    { run = "xdg-open %s1", desc = "Open", for = "linux" },
    { run = "open %s", desc = "Open", for = "macos" },
    { run = 'start "" %s1', desc = "Open", for = "windows", orphan = true },
]
extract = [
    { run = 'ouch d -y %*', desc = "Extract here with ouch(Windows)", for = "windows" },
    { run = 'ouch d -y "$@"', desc = "Extract here with ouch(Linux)", for = "linux" },
    { run = "ya pub extract --list %s", desc = "Extract here with ouch(MacOS)", for = "macos" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
]
prepend_rules = [
    { url = "*.json", use = "edit" },
    { url = "*.conf", use = "edit" },
    # Multiple openers for a single rule
    { url = "*.html", use = [ "open", "edit" ] },
]
append_rules = [
    { url = "*", use = "edit" },
]

[plugin]
prepend_fetchers = [
    { id = "git", url = "*", run = "git", group = "git" },
    { id = "git", url = "*/", run = "git", group = "git" },
]
prepend_previewers = [
    { url = '**/.git/', run = 'preview-git' },
    { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run  = "ouch" },
]
