[[mgr.prepend_keymap]]
on   = [ "<Right>" ]
run  = "plugin fast-enter"
desc = "Enter the subfolder faster, or open the file directly"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

## TD-Sky/sudo
# sudo cp/mv
[[mgr.prepend_keymap]]
on = ["R", "p", "p"]
run = "plugin sudo -- paste"
desc = "sudo paste"

# sudo cp/mv --force
[[mgr.prepend_keymap]]
on = ["R", "P"]
run = "plugin sudo -- paste --force"
desc = "sudo paste"

# sudo mv
[[mgr.prepend_keymap]]
on = ["R", "r"]
run = "plugin sudo -- rename"
desc = "sudo rename"

# sudo ln -s (absolute-path)
[[mgr.prepend_keymap]]
on = ["R", "p", "l"]
run = "plugin sudo -- link"
desc = "sudo link"

# sudo ln -s (relative-path)
[[mgr.prepend_keymap]]
on = ["R", "p", "r"]
run = "plugin sudo -- link --relative"
desc = "sudo link relative path"

# sudo ln
[[mgr.prepend_keymap]]
on = ["R", "p", "L"]
run = "plugin sudo -- hardlink"
desc = "sudo hardlink"

# sudo touch/mkdir
[[mgr.prepend_keymap]]
on = ["R", "a"]
run = "plugin sudo -- create"
desc = "sudo create"

# sudo trash
[[mgr.prepend_keymap]]
on = ["R", "d"]
run = "plugin sudo -- remove"
desc = "sudo trash"

# sudo delete
# [[mgr.prepend_keymap]]
# on = ["R", "D"]
# run = "plugin sudo -- remove --permanently"
# desc = "sudo delete"

# sudo chmod
[[mgr.prepend_keymap]]
on = ["R", "m"]
run = "plugin sudo -- chmod"
desc = "sudo chmod"

## yazi-rs/plugins:zoom
[[mgr.prepend_keymap]]
on = ["="]
run = "plugin zoom 1"
desc = "Zoom in the preview image"

[[mgr.prepend_keymap]]
on = ["-"]
run = "plugin zoom -1"
desc = "Zoom out the preview image"

## "-" now zooms, so symlink yanked files with "_" (preset had "_" for relative links)
[[mgr.prepend_keymap]]
on = ["_"]
run = "link"
desc = "Symlink the absolute path of yanked files"

## Ctrl+- keeps the preset relative-link behaviour (needs extended keys / CSI u)
[[mgr.prepend_keymap]]
on = ["<C-->"]
run = "link --relative"
desc = "Symlink the relative path of yanked files"

## yazi-rs/plugins:toggle-pane
[[mgr.prepend_keymap]]
on = ["T"]
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"
